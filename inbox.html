    <!-- Main Container -->
    <div class="main-container">
        <!-- Inbox Section -->
        <section class="inbox-section">
            <div class="container">
                <h2 class="section-title">Message Inbox</h2>
                <p class="section-subtitle">Share your thoughts anonymously</p>
                
                <div class="inbox-container">
                    <!-- Message Form -->
                    <div class="message-form-container">
                        <div class="form-card">
                            <h3><i class="fas fa-paper-plane"></i> Leave a Message</h3>
                            <form id="messageForm" class="message-form">
                                <div class="form-group">
                                    <textarea id="messageContent" placeholder="Type your message here..." rows="4" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-rocket"></i> Send Message
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Messages Display -->
                    <div class="messages-container">
                        <div class="messages-header">
                            <h3><i class="fas fa-inbox"></i> Message History</h3>
                            <div class="messages-controls">
                                <div class="realtime-status">
                                    <span class="status-dot"></span>
                                    <span class="status-text">Connecting...</span>
                                </div>
                            </div>
                        </div>
                        
                        <div id="messagesList" class="messages-list">
                            <!-- Messages will be loaded here -->
                            <div class="loading-messages">
                                <div class="loading-spinner"></div>
                                <p>Loading messages...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
