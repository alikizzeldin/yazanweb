version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Replacing environment variables..."
        - sed -i 's|%SUPABASE_URL%|'$SUPABASE_URL'|g' inbox.js
        - sed -i 's|%SUPABASE_ANON_KEY%|'$SUPABASE_ANON_KEY'|g' inbox.js
    build:
      commands:
        - echo "Build completed"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
